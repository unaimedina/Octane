name: opencode-web

services:
  # Prepare the shared skills and per-user data volumes with the web
  # container's UID before the other services mount them.
  skills-init:
    image: alpine:3.20
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /skills /users && chown -R 1001:1001 /skills && chown 1001:1001 /users"]
    volumes:
      - opencode-skills:/skills
      - opencode-users:/users
    restart: "no"

  # OCTANE authenticates requests and starts one isolated OpenCode server per
  # signed-in user. The OpenCode CLI is copied into the web image.
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: opencode-web:local
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    networks:
      - traefik
    volumes:
      # The web client shares the workspace with every per-user OpenCode server.
      - ${WORKSPACE_PATH:-./workspace}:/workspace
      # Skills installed from Settings are shared with every user's server.
      - opencode-skills:/home/nextjs/.config/opencode/skills
      # Sessions, Anthropic keys and Console logins are isolated per user here.
      - opencode-users:/home/nextjs/.local/share/octane/users
      # Project metadata and encrypted GitHub tokens.
      - octane-data:/home/nextjs/.local/share/octane-data
      # Keep git identity/safe.directory consistent for user servers.
      - ./docker/gitconfig:/home/nextjs/.gitconfig:ro
    environment:
      OPENCODE_SERVER_MODE: ${OPENCODE_SERVER_MODE:-per-user}
      OPENCODE_BIN: /usr/local/bin/opencode
      OPENCODE_USERS_DIR: /home/nextjs/.local/share/octane/users
      OPENCODE_WORKSPACE: /workspace
      # Projects and encrypted GitHub connections.
      OCTANE_DATA_DIR: /home/nextjs/.local/share/octane-data
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-}
      GITHUB_SCOPES: "${GITHUB_SCOPES:-read:user repo}"
      # Shared mode only. Ignored when OPENCODE_SERVER_MODE=per-user.
      OPENCODE_SERVER_URL: ${OPENCODE_SERVER_URL:-http://127.0.0.1:4096}
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:-opencode}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:-}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH:-}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      AUTH_USERNAME: ${AUTH_USERNAME:-opencode}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      DISCORD_ROLE_ID: ${DISCORD_ROLE_ID:-}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI:-}
      # Writable shared skills volume.
      OPENCODE_SKILLS_DIR: /home/nextjs/.config/opencode/skills
      # Optional local usage budgets in USD.
      USAGE_ROLLING_BUDGET_USD: ${USAGE_ROLLING_BUDGET_USD:-}
      USAGE_WEEKLY_BUDGET_USD: ${USAGE_WEEKLY_BUDGET_USD:-}
      USAGE_MONTHLY_BUDGET_USD: ${USAGE_MONTHLY_BUDGET_USD:-}
    depends_on:
      skills-init:
        condition: service_completed_successfully
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.voltic-uploader.rule=Host(`lab.voltic.dev`)"
      - "traefik.http.routers.voltic-uploader.entrypoints=websecure"
      - "traefik.http.routers.voltic-uploader.tls.certresolver=myresolver"
      - "traefik.http.services.voltic-uploader.loadbalancer.server.port=3000"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1:3000/api/health",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  opencode-skills:
  opencode-users:
  octane-data:

networks:
  traefik:
    external: true
