name: opencode-web

services:
  # Prepare the shared skills volume with the web container's UID before the
  # other services mount it.
  skills-init:
    image: alpine:3.20
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /skills && chown -R 1001:1001 /skills"]
    volumes:
      - opencode-skills:/skills
    restart: "no"

  # Headless OpenCode server. Update the tag deliberately; pin a version you
  # have tested rather than tracking :latest in production.
  opencode:
    image: ghcr.io/anomalyco/opencode:2.2.2
    restart: unless-stopped
    working_dir: /workspace
    command: ["serve", "--hostname", "0.0.0.0", "--port", "4096"]
    depends_on:
      skills-init:
        condition: service_completed_successfully
    environment:
      OPENCODE_SERVER_USERNAME: opencode
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?set OPENCODE_SERVER_PASSWORD in .env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ${WORKSPACE_PATH:-./workspace}:/workspace
      - opencode-data:/root/.local/share/opencode
      - opencode-skills:/root/.config/opencode/skills
      - ./docker/gitconfig:/root/.gitconfig:ro
    networks:
      - internal
    expose:
      - "4096"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: opencode-web:local
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    networks:
      - traefik
      - internal
    volumes:
      # The web client shares the workspace for file tools and skill installs.
      - ${WORKSPACE_PATH:-./workspace}:/workspace
      # Skills installed from Settings are shared with the OpenCode server.
      - opencode-skills:/home/nextjs/.config/opencode/skills
      # Keep git identity/safe.directory consistent for both containers.
      - ./docker/gitconfig:/home/nextjs/.gitconfig:ro
    environment:
      OPENCODE_SERVER_URL: http://opencode:4096
      OPENCODE_SERVER_USERNAME: opencode
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?set OPENCODE_SERVER_PASSWORD in .env}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH:-}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      AUTH_USERNAME: ${AUTH_USERNAME:-opencode}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      DISCORD_ROLE_ID: ${DISCORD_ROLE_ID:-}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI:-}
      # Writable shared volume mounted into both containers.
      OPENCODE_SKILLS_DIR: /home/nextjs/.config/opencode/skills
      # Optional local usage budgets in USD.
      USAGE_ROLLING_BUDGET_USD: ${USAGE_ROLLING_BUDGET_USD:-}
      USAGE_WEEKLY_BUDGET_USD: ${USAGE_WEEKLY_BUDGET_USD:-}
      USAGE_MONTHLY_BUDGET_USD: ${USAGE_MONTHLY_BUDGET_USD:-}
    depends_on:
      opencode:
        condition: service_started
      skills-init:
        condition: service_completed_successfully
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.voltic-uploader.rule=Host(`lab.voltic.dev`)"
      - "traefik.http.routers.voltic-uploader.entrypoints=websecure"
      - "traefik.http.routers.voltic-uploader.tls.certresolver=myresolver"
      - "traefik.http.services.voltic-uploader.loadbalancer.server.port=3000"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1:3000/api/health",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  opencode-data:
  opencode-skills:

networks:
  traefik:
    external: true
  internal: